name: Verifiche
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: npm run db:local
      - name: Verifica dell’istanza locale
        run: |
          npm start > /tmp/sotto-l-albero.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/me; then break; fi
            sleep 1
          done
          npm run test:e2e
