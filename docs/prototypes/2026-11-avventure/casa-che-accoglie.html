<section id="casa-inventata" lang="it" aria-label="La casa che accoglie, anteprima giocabile">
  <header><span class="ci-chapter">Una casa nel bosco · anteprima</span><h2>Fai spazio a qualcuno.</h2><p>La soffitta è piena di giocattoli, ma gli ospiti sono al piano di sotto. Cosa inventi con quello che trovi?</p></header>
  <div class="ci-choices" aria-label="Scegli cosa costruire"><button type="button" data-kind="fort" aria-pressed="true">Un rifugio di coperte</button><button type="button" data-kind="lift" aria-pressed="false">Un piccolo ascensore</button><button type="button" data-kind="music" aria-pressed="false">Un’orchestra di giocattoli</button></div>
  <div class="ci-play"><p class="ci-instruction"></p><div class="ci-room"><canvas role="img" aria-label="Salotto innevato fuori dalla finestra, due sedie e soffitta con giocattoli"></canvas><div class="ci-targets"></div></div><div class="ci-controls"></div><p class="ci-status" role="status" aria-live="polite"></p><button type="button" class="ci-again">Ricomincia questa costruzione</button><section class="ci-recap" hidden><h3>Il tuo piccolo Natale</h3><label>Il racconto che potresti condividere<textarea class="ci-story" rows="3"></textarea></label><label>Perché hai scelto questa strada? <span>(facoltativo)</span><textarea class="ci-note" rows="2" placeholder="Puoi anche lasciare solo il racconto."></textarea></label><button type="button" class="ci-confirm">Conferma il racconto nell’anteprima</button><p class="ci-confirmed" role="status"></p><small>Resta solo in questa prova. Nessun gusto viene dedotto o aggiunto ai desideri.</small></section></div>
</section>
<style>
#casa-inventata{--ci-pine:#173b32;--ci-paper:#eee5d0;--ci-ink:#273f35;--ci-muted:#59685b;max-width:736px;margin:auto;border-radius:20px;overflow:hidden;background:var(--ci-paper);color:var(--ci-ink);font:400 14px/1.5 system-ui,sans-serif;color-scheme:light}#casa-inventata *{box-sizing:border-box}#casa-inventata header{background:var(--ci-pine);color:#f2e9d8;padding:27px 26px}#casa-inventata h2{font:400 36px/1.1 Georgia,serif;margin:8px 0 12px}#casa-inventata header p{font-size:13px;max-width:580px;color:#ced9cc;margin:0}#casa-inventata .ci-chapter{font-size:11px;color:#e6c587}#casa-inventata button,#casa-inventata textarea{font:inherit}#casa-inventata button{min-height:44px;cursor:var(--cursor-interaction,pointer);border:1px solid #aab9a5;border-radius:9px;padding:10px 13px;color:var(--ci-ink);background:#fcf7e9}#casa-inventata button:disabled{opacity:.45;cursor:default}#casa-inventata button[aria-pressed=true],#casa-inventata .ci-confirm{background:var(--ci-pine);color:#f2e9d8}#casa-inventata [hidden]{display:none!important}#casa-inventata .ci-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:12px 16px;background:#dfd5bb}#casa-inventata .ci-choices button{font-size:12px;padding:10px 6px}#casa-inventata .ci-play{padding:20px 22px}#casa-inventata .ci-instruction{min-height:44px;font:400 22px/1.2 Georgia,serif;margin:0 0 13px}#casa-inventata .ci-room{height:340px;position:relative;border-radius:12px;overflow:hidden;background:#41564a}#casa-inventata canvas{display:block;width:100%;height:100%}#casa-inventata .ci-targets{position:absolute;inset:0;pointer-events:none}#casa-inventata .ci-targets button{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font-size:11px;min-width:44px;background:#f6ebd5eb;padding:7px 9px;max-width:90px}#casa-inventata .ci-controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 5px}#casa-inventata .ci-controls button{font-size:12px}#casa-inventata .ci-status{min-height:42px;font-size:12px;margin:9px 0;color:var(--ci-muted)}#casa-inventata .ci-again{font-size:12px;background:transparent}#casa-inventata .ci-recap{margin-top:22px;padding-top:16px;border-top:1px solid #b9c3af}#casa-inventata h3{font:400 26px Georgia,serif;margin:0 0 12px}#casa-inventata label{display:block;font-size:12px;margin:14px 0}#casa-inventata textarea{display:block;width:100%;min-height:68px;border:1px solid #aab9a5;border-radius:8px;padding:11px;margin-top:7px;background:#fcf7e9;color:var(--ci-ink);resize:vertical;font-size:16px}#casa-inventata small{display:block;font-size:11px;color:var(--ci-muted);margin-top:14px}#casa-inventata .ci-confirmed{font-size:12px}#casa-inventata .ci-confirm{font-size:12px}@media(max-width:480px){#casa-inventata header{padding:23px 18px}#casa-inventata h2{font-size:31px}#casa-inventata .ci-play{padding:17px 12px}#casa-inventata .ci-room{height:300px}#casa-inventata .ci-choices{padding:10px 8px;gap:3px}#casa-inventata .ci-choices button{font-size:11px}#casa-inventata .ci-instruction{font-size:21px}}
#casa-inventata .ci-targets button[data-act^="pillow:"]{width:44px;max-width:44px;padding:4px}#casa-inventata .ci-targets button[data-act^="wire:"]{width:74px;max-width:74px;padding:5px}</style>
<script>
(()=>{
const root=document.getElementById('casa-inventata'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),targets=root.querySelector('.ci-targets'),controls=root.querySelector('.ci-controls'),status=root.querySelector('.ci-status'),recap=root.querySelector('.ci-recap');
const states={fort:{pins:[],pillows:[],guest:0,done:false},lift:{rail:false,height:0,guest:0,done:false},music:{order:[],beat:0,played:0,done:false}};
let kind='fort',w=0,h=0,animation=0;const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=(x,y)=>({x:w*x/100,y:h*y/100});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function box(x,y,ww,hh,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fill();}
function line(a,b,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function gift(x,y,c='#ba775d',s=1){box(x-10*s,y-15*s,20*s,16*s,2,c);ctx.fillStyle='#e3c17c';ctx.fillRect(x-2*s,y-15*s,4*s,16*s);ctx.fillRect(x-11*s,y-15*s,22*s,3*s);}
function person(x,y,c,s=1){ctx.fillStyle='#ddc5a0';ctx.beginPath();ctx.arc(x,y-18*s,5*s,0,7);ctx.fill();box(x-5*s,y-13*s,10*s,14*s,3,c);line({x:x-3*s,y:y},{x:x-4*s,y:y+8*s},'#d9d4bd',2);line({x:x+3*s,y:y},{x:x+4*s,y:y+8*s},'#d9d4bd',2);}
function toy(x,y,i,active=false){ctx.save();ctx.translate(x,y);if(active)ctx.translate(0,-5);if(i===0){box(-13,-12,26,20,5,'#b37457');ctx.fillStyle='#e5c395';for(const dx of[-9,9]){ctx.beginPath();ctx.arc(dx,-14,5,0,7);ctx.fill();}box(-9,-7,18,12,6,'#cf9a66');}else if(i===1){ctx.fillStyle='#ddc17b';ctx.beginPath();ctx.moveTo(0,-18);ctx.quadraticCurveTo(-13,-12,-12,3);ctx.lineTo(12,3);ctx.quadraticCurveTo(13,-12,0,-18);ctx.fill();}else{box(-14,-9,28,19,3,'#9fae99');ctx.strokeStyle='#e6d8b4';ctx.lineWidth=3;for(let k=0;k<3;k++)line({x:-9+k*9,y:-7},{x:-9+k*9,y:8},'#e6d8b4',2);}ctx.restore();}
function draw(){if(!w)return;ctx.clearRect(0,0,w,h);const wall=ctx.createLinearGradient(0,0,0,h);wall.addColorStop(0,'#576a54');wall.addColorStop(1,'#7c8460');ctx.fillStyle=wall;ctx.fillRect(0,0,w,h);for(let i=0;i<18;i++){ctx.fillStyle='#ffffff08';ctx.fillRect(i*w/18,0,1,h);}
// A snowy window, a warm hearth, and a real second level.
const win=P(22,32);box(win.x-34,win.y-39,68,76,3,'#283e3e');box(win.x-29,win.y-34,58,65,1,'#24454a');for(let i=0;i<17;i++){ctx.fillStyle='#e3e4cd';ctx.fillRect(win.x-25+(i*19)%49,win.y-31+(i*23)%58,2,2);}line({x:win.x,y:win.y-34},{x:win.x,y:win.y+31},'#b8a882',4);line({x:win.x-29,y:win.y},{x:win.x+29,y:win.y},'#b8a882',4);
const loft=P(70,24);box(loft.x-55,loft.y,110,10,2,'#b59770');for(let i=0;i<3;i++)toy(loft.x-32+i*31,loft.y-5,i,kind==='music'&&states.music.beat===i&&states.music.played>0);ctx.fillStyle='#d5c398';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('La soffitta',loft.x,loft.y-40);
ctx.fillStyle='#b59770';ctx.beginPath();ctx.moveTo(0,h*.75);ctx.lineTo(w,h*.75);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<6;i++)line(P(0,77+i*5),P(100,77+i*5),'#5b513c33',1);box(w*.19,h*.78,w*.6,h*.13,25,'#b78365');
const fire=P(8,62);box(fire.x-17,fire.y-32,34,42,4,'#92866a');box(fire.x-11,fire.y-23,22,32,8,'#26342b');ctx.fillStyle='#eac078';ctx.beginPath();ctx.moveTo(fire.x-8,fire.y+4);ctx.quadraticCurveTo(fire.x-13,fire.y-8,fire.x,fire.y-18);ctx.quadraticCurveTo(fire.x+2,fire.y-5,fire.x+8,fire.y-10);ctx.quadraticCurveTo(fire.x+14,fire.y+7,fire.x-8,fire.y+4);ctx.fill();
for(const x of[31,70]){const p=P(x,78);box(p.x-19,p.y-39,7,42,2,'#65533d');box(p.x-19,p.y-11,36,8,2,'#d1b17b');line({x:p.x-14,y:p.y-4},{x:p.x-15,y:p.y+13},'#65533d',4);line({x:p.x+11,y:p.y-4},{x:p.x+12,y:p.y+13},'#65533d',4);}
const s=states[kind];if(kind==='fort'){
 if(s.pins.length===2){const a=P(31,65),b=P(70,65);ctx.fillStyle='#cbb68c';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(w*.5,h*.51,b.x,b.y);ctx.lineTo(w*.79,h*.88);ctx.lineTo(w*.23,h*.88);ctx.closePath();ctx.fill();ctx.fillStyle='#334b3d';ctx.beginPath();ctx.moveTo(w*.5,h*.67);ctx.lineTo(w*.6,h*.87);ctx.lineTo(w*.4,h*.87);ctx.fill();for(let i=0;i<7;i++){ctx.fillStyle='#e5c681';ctx.beginPath();ctx.arc(w*(.33+i*.055),h*(.63+Math.abs(i-3)*.015),2.4,0,7);ctx.fill();}}
 s.pillows.forEach((place,i)=>{const p=P(32+place*18,86);box(p.x-13,p.y-5,26,10,5,['#9c6674','#a1ae87','#d8b47d'][i%3]);});if(s.guest>0){const p=P(90-s.guest*36,81);person(p.x,p.y,'#7c3448');person(p.x+14,p.y+3,'#294f49',.8);}
}else if(kind==='lift'){
 const x=w*.8,y=h*(.78-s.height*.55);if(s.rail){line(P(80,23),P(80,80),'#dec697',2);line(P(82,23),P(82,80),'#dec697',2);ctx.strokeStyle='#c7aa72';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w*.81,h*.23,8,0,7);ctx.stroke();}box(x-20,y-3,40,8,2,'#a06d4f');gift(x,y-5);if(s.height>0)person(x-7,y-21,'#627e8b',.65);if(s.done){toy(w*.64,h*.82,0);toy(w*.54,h*.82,2);}
}else{
 const points=[P(20,81),P(50,81),P(80,81)];s.order.forEach((v,i)=>{if(i)line(points[s.order[i-1]],points[v],'#dfbd76',3);});points.forEach((p,i)=>toy(p.x,p.y,i,s.played>0&&s.beat===i));if(s.played){person(w*.2,h*.86,'#7c3448');person(w*.82,h*.86,'#294f49');if(s.beat>=0){ctx.strokeStyle='#e0c487';ctx.lineWidth=2;const p=points[s.beat];for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(p.x,p.y-12,24+i*8,-2.7,-.5);ctx.stroke();}}}
}
ctx.fillStyle='#fff4d0';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(w*(.08+i*.105),h*(.09+Math.sin(i*.7)*.025),2.5,0,7);ctx.fill();}}
function animate(step,finish,duration=900){cancelAnimationFrame(animation);if(reduced()){step(1);draw();finish?.();return;}const start=performance.now();const tick=t=>{const p=Math.min(1,(t-start)/duration);step(p);draw();if(p<1)animation=requestAnimationFrame(tick);else finish?.();};animation=requestAnimationFrame(tick);}
const target=(label,x,y,act,disabled=false)=>`<button type="button" data-act="${act}" style="left:${x}%;top:${y}%" ${disabled?'disabled':''}>${label}</button>`;
function completed(){const s=states[kind];s.done=true;recap.hidden=false;const texts={fort:'Ho costruito un rifugio di coperte e preparato dei posti per stare insieme.',lift:'Ho montato un piccolo ascensore per portare i giocattoli dalla soffitta al salotto.',music:'Ho collegato i giocattoli in un’orchestra. Il loro ordine cambia il ritmo della festa.'};root.querySelector('.ci-story').value=s.story??texts[kind];root.querySelector('.ci-note').value=s.note??'';root.querySelector('.ci-confirmed').textContent=s.confirmed?'Racconto confermato solo in questa prova.':'';}
function render(){const s=states[kind];root.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));targets.innerHTML='';controls.innerHTML='';recap.hidden=!s.done;
 if(kind==='fort'){
 root.querySelector('.ci-instruction').textContent=s.pins.length<2?'Aggancia la coperta alle due sedie.':s.pillows.length<2?'Scegli due posti per i cuscini sotto la coperta.':'Ora puoi invitare gli ospiti nel rifugio.';
 if(s.pins.length<2)targets.innerHTML=target('Sedia sinistra',31,61,'pin:0',s.pins.includes(0))+target('Sedia destra',70,61,'pin:1',s.pins.includes(1));else if(s.pillows.length<2)targets.innerHTML=[0,1,2].map(i=>target('Posto '+(i+1),32+i*18,88,'pillow:'+i,s.pillows.includes(i))).join('');
 if(s.pillows.length===2)controls.innerHTML='<button type="button" data-act="invite" '+(s.done?'disabled':'')+'>Invita gli ospiti</button>';
 status.textContent=s.done?'Gli ospiti si sono sistemati nei posti che hai preparato.':s.pins.length<2?'La coperta prenderà forma tra le sedie che tocchi.':'Il rifugio esiste già: ora decidi dove far accomodare qualcuno.';
 }else if(kind==='lift'){
 root.querySelector('.ci-instruction').textContent=!s.rail?'Monta la carrucola sopra la pedana.':!s.done?'Aziona la manovella: la pedana sale davvero.':'Il piccolo ascensore ha raggiunto la soffitta.';
 if(!s.rail)targets.innerHTML=target('Monta carrucola',81,22,'rail');else controls.innerHTML='<button type="button" data-act="crank" '+(s.done?'disabled':'')+'>Gira la manovella</button>';
 status.textContent=!s.rail?'La pedana è al piano terra. La carrucola collegherà i due piani.':s.done?'I giocattoli sono scesi in salotto. Puoi cambiare il racconto.':`Salita: ${Math.round(s.height*100)}%. Ogni giro avvicina il carico alla soffitta.`;
 }else{
 root.querySelector('.ci-instruction').textContent=s.order.length<3?'Collega i tre giocattoli nell’ordine che vuoi.':'Premi i giocattoli collegati: il ritmo segue il tuo ordine.';
 const labels=['Orsetto tamburo','Campanella','Scatola sonora'];if(s.order.length<3)targets.innerHTML=labels.map((v,i)=>target(v,20+i*30,76,'wire:'+i,s.order.includes(i))).join('');
 if(s.order.length===3)controls.innerHTML='<button type="button" data-act="play">Suona l’orchestra</button>';
 status.textContent=s.order.length?`Sequenza: ${s.order.map(i=>labels[i]).join(' → ')}.`:'Il primo giocattolo che scegli dà l’attacco; gli altri gli rispondono.';
 }if(s.done)completed();draw();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.kind){cancelAnimationFrame(animation);kind=b.dataset.kind;render();return;}const s=states[kind],act=b.dataset.act;if(act?.startsWith('pin:')){s.pins.push(Number(act.split(':')[1]));render();}if(act?.startsWith('pillow:')){s.pillows.push(Number(act.split(':')[1]));render();}if(act==='invite'){b.disabled=true;animate(p=>s.guest=p,()=>{completed();render();},1100);}if(act==='rail'){s.rail=true;render();}if(act==='crank'){b.disabled=true;const start=s.height,end=Math.min(1,start+.25);animate(p=>s.height=start+(end-start)*p,()=>{if(end===1)completed();render();},500);}if(act?.startsWith('wire:')){s.order.push(Number(act.split(':')[1]));render();}if(act==='play'){b.disabled=true;s.played++;animate(p=>s.beat=s.order[Math.min(2,Math.floor(p*3))],()=>{completed();render();},1800);}if(b.classList.contains('ci-again')){cancelAnimationFrame(animation);states[kind]=kind==='fort'?{pins:[],pillows:[],guest:0,done:false}:kind==='lift'?{rail:false,height:0,done:false}:{order:[],beat:0,played:0,done:false};render();}if(b.classList.contains('ci-confirm')){s.story=root.querySelector('.ci-story').value;s.note=root.querySelector('.ci-note').value;s.confirmed=true;root.querySelector('.ci-confirmed').textContent='Racconto confermato solo in questa prova.';}});
root.querySelector('.ci-story').addEventListener('input',e=>{states[kind].story=e.target.value;states[kind].confirmed=false;root.querySelector('.ci-confirmed').textContent='';});root.querySelector('.ci-note').addEventListener('input',e=>{states[kind].note=e.target.value;states[kind].confirmed=false;root.querySelector('.ci-confirmed').textContent='';});
new ResizeObserver(()=>{const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw();}).observe(canvas);
render();
})();
</script>
